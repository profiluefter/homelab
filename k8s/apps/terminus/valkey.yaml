apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminus-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terminus-valkey
  template:
    metadata:
      labels:
        app: terminus-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terminus-valkey
spec:
  selector:
    app: terminus-valkey
  ports:
    - port: 6379
      targetPort: 6379
