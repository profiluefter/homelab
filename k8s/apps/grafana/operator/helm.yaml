apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-charts
  namespace: flux-system
spec:
  interval: 4h
  type: oci
  url: oci://ghcr.io/grafana/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: flux-system
spec:
  interval: 4h
  chart:
    spec:
      chart: grafana-operator
      version: 5.22.2
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  targetNamespace: grafana-operator
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
