apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik-repo
  namespace: flux-system
spec:
  interval: 4h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 4h
  chart:
    spec:
      chart: authentik
      version: 2024.6.x
      sourceRef:
        kind: HelmRepository
        name: authentik-repo
        namespace: flux-system
  targetNamespace: authentik
  values:
    server:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - auth.s.h-a.cc
        tls:
          - hosts:
              - auth.s.h-a.cc
            secretName: authentik-tls

    postgresql:
      enabled: false

    redis:
      enabled: false

    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret-key
              key: secret-key
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret-key
              key: bootstrap-password

        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: host
        - name: AUTHENTIK_POSTGRESQL__NAME
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: dbname
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: username
        - name: AUTHENTIK_POSTGRESQL__PORT
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: port
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: password

        - name: AUTHENTIK_REDIS__HOST
          value: "authentik-redis.authentik.svc.cluster.local"
        - name: AUTHENTIK_REDIS__PORT
          value: "6379"
        - name: AUTHENTIK_REDIS__DB
          value: "0"

    additionalObjects:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: authentik-postgres
          namespace: authentik
        spec:
          instances: 1
          storage:
            size: 5Gi
      - apiVersion: redis.redis.opstreelabs.in/v1beta2
        kind: Redis
        metadata:
          name: authentik-redis
          namespace: authentik
        spec:
          kubernetesConfig:
            image: quay.io/opstree/redis:v7.2.6
          # persistence is not required here
