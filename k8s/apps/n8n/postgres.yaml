apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  backup:
    volumeSnapshot:
      className: longhorn-snapshot
      online: true
      onlineConfiguration:
        waitForArchive: true
  bootstrap:
    initdb:
      database: n8n
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-postgres-backup
  namespace: n8n
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: n8n-postgres
  method: volumeSnapshot
  immediate: true
