apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atuin-postgres
spec:
  instances: 1
  storage:
    size: 2Gi
  backup:
    volumeSnapshot:
      className: longhorn-snapshot
      online: true
      onlineConfiguration:
        waitForArchive: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: atuin-postgres-backup
  namespace: atuin
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: atuin-postgres
  method: volumeSnapshot
  immediate: true
