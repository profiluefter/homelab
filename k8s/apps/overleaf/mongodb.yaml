apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: overleaf-mongodb
  namespace: overleaf
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: overleaf-mongodb
  template:
    metadata:
      labels:
        app: overleaf-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - mountPath: /data/db
              name: mongodb-data
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: overleaf-mongodb
  namespace: overleaf
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: overleaf-mongodb
  ports:
    - port: 27017
      targetPort: mongodb
