apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-cleanup
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/infra/maintenance/snapshot-cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: snapshot-cleanup
      namespace: maintenance
