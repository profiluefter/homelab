apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ot-container-kit-repo
  namespace: flux-system
spec:
  interval: 4h
  url: https://ot-container-kit.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 4h
  chart:
    spec:
      chart: redis-operator
      version: 0.18.1
      sourceRef:
        kind: HelmRepository
        name: ot-container-kit-repo
        namespace: flux-system
  targetNamespace: redis-operator
  values:
    certmanager:
      enabled: false # we already have certmanager
    redisOperator:
      # we apparently need a certificate for this feature (which itself is pretty undocumented)
      # the examples try to get a letsencrypt certificate for the cluster internal URL which can not work
      # maybe I can try a self-signed certificate in the future but for now I don't think I'll need this feature
      webhook: false
