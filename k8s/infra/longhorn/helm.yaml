apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: flux-system
spec:
  interval: 4h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 4h
  chart:
    spec:
      chart: longhorn
      version: 1.11.x
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
        namespace: flux-system
  targetNamespace: longhorn-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-ui
                        env:
                          - name: LONGHORN_UI_PORT
                            value: "8000; large_client_header_buffers 4 32k"
  values:
    ingress:
      enabled: true
      host: longhorn.s.h-a.cc
      tls: true
      tlsSecret: longhorn-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd
    persistence:
      defaultClassReplicaCount: 2 # not enough nodes currently
      defaultDataLocality: best-effort
    defaultSettings:
      backupTarget: nfs://10.0.0.22:/Kubernetes
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
